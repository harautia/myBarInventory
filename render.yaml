databases:
  - name: mybarinventory-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: mybarinventory
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mybarinventory-db
          property: connectionString
